%YAML 1.2
---
$id: http://devicetree.org/schemas/display/google,malibu-dc9x00.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Google Malibu DC9x00 display controller

maintainers:
  - Peter Griffin <peter.griffin@linaro.org>

description:
  The Google Malibu DC9x00 display controller has a dedicated frame-start
  interrupt for output 0, routed through the display interrupt aggregators.

properties:
  compatible:
    const: google,malibu-dc9x00

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  interrupt-names:
    const: frame-start

  power-domains:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - power-domains

additionalProperties: false
