%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/google,malibu-dsi-cdphy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Google Malibu MIPI display C/D-PHY

maintainers:
  - Peter Griffin <peter.griffin@linaro.org>

properties:
  compatible:
    const: google,malibu-dsi-cdphy

  reg:
    items:
      - description: C/D-PHY transmitter registers
      - description: PHY APB register bank

  reg-names:
    items:
      - const: cdphy-tx
      - const: apb

  clocks:
    maxItems: 1

  clock-names:
    const: pllref

  power-domains:
    maxItems: 1

  '#phy-cells':
    const: 0

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - clock-names
  - power-domains
  - '#phy-cells'

additionalProperties: false
