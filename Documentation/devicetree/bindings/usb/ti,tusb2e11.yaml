%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/ti,tusb2e11.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Texas Instruments TUSB2E11 eUSB2 repeater

maintainers:
  - Peter Griffin <peter.griffin@linaro.org>

description: |
  The TUSB2E11 repeater bridges an eUSB2 PHY and a USB 2.0 port. In the
  regulator-controlled configuration, the USB role switch takes supply
  references in host or device mode and releases them in the disconnected
  state.

properties:
  compatible:
    const: ti,tusb2e11

  reg:
    maxItems: 1

  usb-role-switch:
    $ref: /schemas/types.yaml#/definitions/flag

  vdd33-supply:
    description: 3.3 V supply.

  vdd18-supply:
    description: 1.8 V nominal supply.

  vdd-reset-supply:
    description: Board supply that controls repeater reset sequencing.

required:
  - compatible
  - reg
  - usb-role-switch
  - vdd33-supply
  - vdd18-supply
  - vdd-reset-supply

additionalProperties: false
