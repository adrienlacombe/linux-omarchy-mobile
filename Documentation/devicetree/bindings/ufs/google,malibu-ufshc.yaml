%YAML 1.2
---
$id: http://devicetree.org/schemas/ufs/google,malibu-ufshc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Google Tensor G6 Malibu UFS host controller

maintainers:
  - Peter Griffin <peter.griffin@linaro.org>

description: |
  Malibu integrates a UFS HCI, a PHY with a dedicated SRAM window, and
  separate interrupt routing for the host and multiple completion queues.

properties:
  compatible:
    const: google,malibu-ufshc

  reg:
    items:
      - description: Host controller registers
      - description: UFS top registers
      - description: UFS security control registers
      - description: PHY SRAM
      - description: UFS subsystem registers
      - description: HSIO-S power sequencer status
      - description: Host controller power sequencer status
      - description: PHY power sequencer status

  reg-names:
    items:
      - const: hci
      - const: top
      - const: sec
      - const: phy-sram
      - const: subsystem
      - const: psm-hsios
      - const: psm-hci
      - const: psm-phy

  interrupts-extended:
    minItems: 17
    maxItems: 17
    description: |
      The host interrupt through the HSIO-S interrupt aggregator, followed
      by 16 direct GIC interrupts for the multiple completion queues.

  interrupt-names:
    items:
      - const: hci
      - const: mcq0
      - const: mcq1
      - const: mcq2
      - const: mcq3
      - const: mcq4
      - const: mcq5
      - const: mcq6
      - const: mcq7
      - const: mcq8
      - const: mcq9
      - const: mcq10
      - const: mcq11
      - const: mcq12
      - const: mcq13
      - const: mcq14
      - const: mcq15

  iommus:
    maxItems: 1

  dma-coherent: true

  clocks:
    items:
      - description: UFS device reference clock gate
      - description: 38.4 MHz M-PHY reference clock gate
      - description: UFS controller core clock gate
      - description: Deep Hibern8 clock gate

  clock-names:
    items:
      - const: gpio-ref
      - const: mphy-ref
      - const: core
      - const: deep-h8

  resets:
    maxItems: 1

  reset-names:
    const: phy

  power-domains:
    items:
      - description: UFS preparation domain
      - description: UFS core domain

  power-domain-names:
    items:
      - const: prep
      - const: core

  vdd0p75-supply:
    description: 0.75 V HSIO analog supply.

  vdd1p2-supply:
    description: 1.2 V HSIO analog supply.

  vcc-supply:
    description: 2.5 V UFS device supply.

  vccq-supply:
    description: 1.2 V UFS device I/O supply.

  phy-cal-data:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 74
    maxItems: 74
    description: |
      Per-device M-PHY calibration cells supplied by the bootloader. Each
      cell packs the register address in the low 16 bits and its value in
      the high 16 bits. The cells must be applied in their supplied order.

  google,rext-val:
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 63
    description: Six-bit PHY resistor trim supplied by the bootloader.

  google,enable-hs-lss:
    type: boolean
    description: Enable the high-speed link startup sequence for calibrated boards.

  google,mphy-pmc-war:
    type: boolean
    description: Apply the M-PHY power mode change workaround.

  google,enable-phy-patching:
    type: boolean
    description: Load a firmware patch into M-PHY SRAM.

required:
  - compatible
  - reg
  - reg-names
  - interrupts-extended
  - interrupt-names
  - iommus
  - dma-coherent
  - clocks
  - clock-names
  - resets
  - reset-names
  - power-domains
  - power-domain-names
  - vdd0p75-supply
  - vdd1p2-supply
  - vcc-supply
  - vccq-supply

additionalProperties: false
