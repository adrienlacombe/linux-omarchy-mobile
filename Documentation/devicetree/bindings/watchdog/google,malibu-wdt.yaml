%YAML 1.2
---
$id: http://devicetree.org/schemas/watchdog/google,malibu-wdt.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Google Tensor G6 cluster watchdog

maintainers:
  - Peter Griffin <peter.griffin@linaro.org>

description: |
  Malibu has two watchdogs clocked by the Global Time Counter oscillator.
  The early handoff driver services watchdogs left running by the bootloader
  and preserves their existing expiry action.

allOf:
  - $ref: watchdog.yaml#

properties:
  compatible:
    const: google,malibu-wdt

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

required:
  - compatible
  - reg
  - clocks
  - timeout-sec

unevaluatedProperties: false
